##############################
# server #

server.ssl.enabled=true
#server.port=443

# The format used for the keystore. for JKS, set it as JKS
server.ssl.key-store-type=PKCS12

# The path to the keystore containing the certificate
#server.ssl.key-store=classpath:keystore/interfaceio.p12
server.ssl.key-store=classpath:keystore/with_cert_ks.p12

# The password used to generate the certificate
#server.ssl.key-store-password=
server.ssl.key-store-password=password

# The alias mapped to the certificate
#server.ssl.key-alias=interfaceio
server.ssl.key-alias=geonet
server.ssl.key-password=password
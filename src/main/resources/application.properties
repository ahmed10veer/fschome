# DB #

#spring.jpa.show-sql: true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/fsc_home?useSSL=false
spring.datasource.username=root

#remote
spring.datasource.password=

#windows
#spring.datasource.password=password

##############################
# server #

server.port=8088
#server.http.port=8080
#server.ssl.enabled=true


##############################
# server #

server.ssl.enabled=true
#server.port=443

# The format used for the keystore. for JKS, set it as JKS
server.ssl.key-store-type=PKCS12

# The path to the keystore containing the certificate
server.ssl.key-store=classpath:keystore/interfaceio.p12

# The password used to generate the certificate
server.ssl.key-store-password=

# The alias mapped to the certificate
server.ssl.key-alias=interfaceio
server.ssl.key-password=